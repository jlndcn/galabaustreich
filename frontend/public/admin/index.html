<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Inhalte bearbeiten | Streich</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f4ec;
        --ink: #141c17;
        --muted: #3a463f;
        --brand: #143b32;
        --line: #d8d3c6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--ink);
      }
      #cms-login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      #cms-login[hidden] { display: none; }
      .card {
        width: min(100%, 420px);
        background: #fff;
        border: 1px solid var(--line);
        padding: 1.75rem;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.35rem;
        color: var(--brand);
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin: 0 0 0.35rem;
      }
      input {
        width: 100%;
        padding: 0.7rem 0.75rem;
        margin-bottom: 0.9rem;
        border: 1px solid var(--line);
        background: #fff;
        font: inherit;
      }
      button {
        width: 100%;
        border: 0;
        background: var(--brand);
        color: #fff;
        padding: 0.8rem 1rem;
        font: inherit;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: wait; }
      .err {
        color: #8a1f1f;
        margin: 0 0 0.9rem;
        font-size: 0.9rem;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div id="cms-login">
      <form class="card" id="cms-login-form">
        <h1>Inhalte bearbeiten</h1>
        <p>Anmeldung mit E-Mail und Passwort. Ein GitHub-Konto ist nicht nötig.</p>
        <div class="err" id="cms-login-error" aria-live="polite"></div>
        <label for="cms-email">E-Mail</label>
        <input id="cms-email" name="email" type="email" autocomplete="username" required />
        <label for="cms-password">Passwort</label>
        <input id="cms-password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" id="cms-login-submit">Anmelden</button>
      </form>
    </div>

    <script>
      (function () {
        var user = null;
        var memoryToken = null;
        var listeners = {};

        // Alte localStorage-Sessions entfernen (Migration).
        try { localStorage.removeItem("garten_cms_jwt"); } catch (e) {}

        function emit(event, data) {
          (listeners[event] || []).forEach(function (cb) {
            try { cb(data); } catch (err) {}
          });
        }

        function setUser(profile, token) {
          memoryToken = token || "cookie";
          user = {
            id: profile && profile.id,
            email: profile && profile.email,
            user_metadata: (profile && profile.user_metadata) || {},
            token: {
              access_token: memoryToken,
              expires_at: Date.now() + 4 * 60 * 60 * 1000,
            },
          };
        }

        function clearUser() {
          user = null;
          memoryToken = null;
        }

        window.netlifyIdentity = {
          on: function (event, cb) {
            (listeners[event] = listeners[event] || []).push(cb);
            if (event === "init") {
              setTimeout(function () { cb(user); }, 0);
            }
          },
          open: function () {
            document.getElementById("cms-login").hidden = false;
          },
          close: function () {
            document.getElementById("cms-login").hidden = true;
          },
          currentUser: function () { return user; },
          logout: function () {
            fetch("/api/cms/identity/logout", {
              method: "POST",
              credentials: "same-origin",
            }).finally(function () {
              clearUser();
              emit("logout");
              window.location.reload();
            });
          },
        };

        function showError(msg) {
          document.getElementById("cms-login-error").textContent = msg || "";
        }

        function loadCms() {
          document.getElementById("cms-login").hidden = true;
          if (window.__cmsLoaded) return;
          window.__cmsLoaded = true;
          var s = document.createElement("script");
          s.src = "/admin/decap-cms.js";
          s.onerror = function () {
            showError("CMS-Bibliothek konnte nicht geladen werden.");
            document.getElementById("cms-login").hidden = false;
          };
          document.body.appendChild(s);
        }

        async function restoreSession() {
          try {
            var res = await fetch("/api/cms/identity/user", {
              credentials: "same-origin",
            });
            if (!res.ok) {
              clearUser();
              return false;
            }
            var profile = await res.json();
            setUser(profile, "cookie");
            return true;
          } catch (e) {
            clearUser();
            return false;
          }
        }

        document.getElementById("cms-login-form").addEventListener("submit", async function (event) {
          event.preventDefault();
          showError("");
          var submit = document.getElementById("cms-login-submit");
          submit.disabled = true;
          try {
            var email = document.getElementById("cms-email").value.trim();
            var password = document.getElementById("cms-password").value;
            var body = new URLSearchParams();
            body.set("grant_type", "password");
            body.set("username", email);
            body.set("password", password);
            var res = await fetch("/api/cms/identity/token", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: body.toString(),
            });
            var data = await res.json().catch(function () { return {}; });
            if (res.status === 429) {
              showError(data.error_description || "Zu viele Fehlversuche. Bitte später erneut versuchen.");
              return;
            }
            if (!res.ok || !data.access_token) {
              showError(data.error_description || "Anmeldung fehlgeschlagen.");
              return;
            }
            setUser(data.user || { email: email }, data.access_token);
            emit("login", user);
            loadCms();
          } catch (e) {
            showError("Netzwerkfehler. Bitte erneut versuchen.");
          } finally {
            submit.disabled = false;
          }
        });

        restoreSession().then(function (ok) {
          if (ok) {
            emit("login", user);
            loadCms();
          }
        });
      })();
    </script>
  </body>
</html>
