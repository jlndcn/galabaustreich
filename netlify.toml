# Netlify-Konfiguration fuer die Website garten-streich.de
# /frontend = statische Astro-Website; Kontaktversand über Netlify Functions.
#
# Erforderliche Environment Variables (ausschliesslich in Netlify -> Site configuration -> Environment variables setzen,
# NIEMALS in dieser Datei oder im Quellcode):
#   SMTP_HOST      = smtp.strato.de
#   SMTP_PORT      = 465
#   SMTP_USER      = info@garten-streich.de
#   SMTP_PASSWORD  = <nur in Netlify hinterlegt>
#   CONTACT_TO     = info@garten-streich.de

[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[build.processing.html]
  pretty_urls = false

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# API-Endpunkt: /api/contact -> Netlify Function "contact" (serverseitig, nur POST)
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200
  force  = true

# Keine Slash-zu-Ohne-Slash-Redirects: Netlify normalisiert diese Pfade
# vor dem Regelvergleich. Solche Regeln sind wirkungslos oder erzeugen Schleifen.
# Canonicals und interne Links verwenden die bestehenden URLs ohne Slash.

# Vorhandene Dateien haben Vorrang. Unbekannte URLs liefern einen echten HTTP 404.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
